name: CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        cd app
        pytest tests/ --cov=.
        
    - name: Build Docker image
      run: |
        docker build -t flash-sales-api .
        
    - name: Push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag flash-sales-api registry.hub.docker.com/yourusername/flash-sales-api:latest
        docker push registry.hub.docker.com/yourusername/flash-sales-api:latest
        docker-compose -f app/docker-compose.prod.yml up -d
